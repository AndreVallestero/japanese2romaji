<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Japanese → Romaji</title>
<!--
  jap2roman: Japanese → syllable-hyphenated Hepburn romaji. Single file, offline.
  - Kana conversion: standard Hepburn (exact).
  - Kanji readings: Joyo kanji on/kun readings (cf. the Agency for Cultural Affairs
    Joyo kanji table; TSV compilation: github.com/hiroshi-manabe/Joyo-Kanji-List).
    Single kanji default to kun reading, kanji runs to on readings; ~200 common
    irregular compounds are listed explicitly in WORDS. Rendaku, names and rare
    readings are NOT handled; unknown kanji pass through unchanged.
-->
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #282828;
    color: #ebdbb2;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid #3c3836;
    background: #1d2021;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 650;
    text-align: center;
  }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .pane {
    flex: 1 1 50%;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    padding: 16px;
  }
  .pane + .pane { border-left: 1px solid #3c3836; }
  .pane-label {
    padding: 0 0 8px;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #a89984;
  }
  textarea, #output {
    flex: 1;
    border-radius: 12px;
    border: 1px solid #3c3836;
    background: #1d2021;
    color: #ebdbb2;
    padding: 14px;
    font-size: 15px;
    line-height: 1.7;
    min-height: 280px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  textarea {
    resize: none;
    outline: none;
  }
  textarea::placeholder { color: #665c54; }
  textarea:focus { border-color: #fabd2f; }
  #output {
    overflow-y: auto;
    margin: 0;
  }
  .output-wrap {
    position: relative;
    flex: 1;
    display: flex;
    min-height: 280px;
  }
  .output-wrap #output {
    flex: 1;
    width: 100%;
  }
  #copyBtn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    background: #3c3836;
    border: 1px solid #504945;
    border-radius: 8px;
    color: #bdae93;
    cursor: pointer;
    opacity: 0.85;
    padding: 0;
  }
  #copyBtn:hover {
    opacity: 1;
    color: #fbf1c7;
    background: #504945;
  }
  #copyBtn svg { width: 15px; height: 15px; }
  #copyBtn .check { display: none; }
  #copyBtn.copied .copy { display: none; }
  #copyBtn.copied .check { display: block; }
  #copyBtn.copied { color: #b8bb26; border-color: #b8bb26; }
  @media (max-width: 700px) {
    main { flex-direction: column; }
    .pane + .pane { border-left: none; border-top: 1px solid #3c3836; }
    textarea, #output { min-height: 220px; }
    .output-wrap { min-height: 220px; }
  }
</style>
</head>
<body>
<header>
  <h1>Japanese → syllable-hyphenated romaji</h1>
</header>
<main>
  <div class="pane">
    <div class="pane-label">Input</div>
    <textarea id="input" spellcheck="false" placeholder="Type here…"></textarea>
  </div>
  <div class="pane">
    <div class="pane-label">Output</div>
    <div class="output-wrap">
      <div id="output" aria-live="polite"></div>
      <button id="copyBtn" type="button" aria-label="Copy output" title="Copy output">
        <svg class="copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>

      </button>
    </div>
  </div>
</main>

    "お茶":["o","cha"],"お金":["o","ka","ne"],"お米":["o","ko","me"],"お菓子":["o","ka","shi"],
    "本":["hon"],"台":["dai"],"玄関":["gen","kan"],"台所":["dai","do","ko","ro"],
    "居間":["i","ma"],"寝室":["shin","shi","tsu"],"洗面所":["sen","men","jo"],
    "冷蔵庫":["rei","zou","ko"],"掃除":["sou","ji"],"洗濯":["sen","ta","ku"],
    "買い物":["ka","i","mo","no"],"散歩":["san","po"],"昼寝":["hi","ru","ne"],
    "昼食":["chuu","sho","ku"],"夕食":["yuu","sho","ku"],"朝食":["chou","sho","ku"],
    "晩御飯":["ban","go","han"],"朝御飯":["a","sa","go","han"],"昼御飯":["hi","ru","go","han"],
    "御馳走":["go","chi","sou"],"乾杯":["kan","pai"],"稲妻":["i","na","zu","ma"],
    "鞄":["ka","ban"],"駅前":["e","ki","mae"],"背中":["se","na","ka"],"手紙":["te","ga","mi"],
    "足跡":["a","shi","a","to"],"親子":["o","ya","ko"],"兄弟":["kyou","dai"],
    "姉妹":["shi","mai"],"夫婦":["fu","u","fu"],"雰囲気":["fu","n","i","ki"],
    "泥棒":["do","ro","bou"],"合図":["a","i","zu"],"日本酒":["ni","hon","shu"],
    "来る":["ku","ru"],"来た":["ki","ta"],"来て":["ki","te"],"来ない":["ko","na","i"],
    "来ます":["ki","ma","su"],"来ました":["ki","ma","shi","ta"]
  };
  var MAXWLEN = (function () {
    var m = 0;
    for (var k in WORDS) {
      if (WORDS.hasOwnProperty(k) && k.length > m) m = k.length;
    }
    return m;
  })();

  // ---------- Syllable buffer ----------
  var VOW = "aeiou";
  function isSV(m) { return m.length === 1 && VOW.indexOf(m) >= 0; }
  function codaOf(m) {
    if (m.indexOf("ch") === 0) return "t";
    if (m.indexOf("sh") === 0) return "s";
    if (m.indexOf("ts") === 0) return "t";
    var c = m.charAt(0);
    if (VOW.indexOf(c) >= 0 || c === "n") return "t";
    return c;
  }
  function pairMerges(a, b) {
    if (a === b) return true;
    var p = a + b;
    return p === "ou" || p === "ei" || p === "ai" || p === "oi" || p === "ui" || p === "au";
  }
  function lastVowel(s) {
    for (var i = s.length - 1; i >= 0; i--) {
      if (VOW.indexOf(s.charAt(i)) >= 0) return s.charAt(i);
    }
    return "";
  }
  function newBuf() {
    var syls = [];
    var gem = false;
    var noVM = false;
    function pushTok(t, vmerge) {
      if (t.k === "gem") { gem = true; return; }
      if (t.k === "n") {
        gem = false;
        if (syls.length) syls[syls.length - 1] += "n";
        else syls.push("n");
        return;
      }
      if (t.k === "long") {
        gem = false;
        if (syls.length) {
          var v = lastVowel(syls[syls.length - 1]);
          if (v) syls[syls.length - 1] += v;
        }
        return;
      }
      var m = t.m;
      if (gem) {
        gem = false;
        if (syls.length && !isSV(m)) syls[syls.length - 1] += codaOf(m);
        else syls.push("tsu");
      }
      var vm = vmerge && !t.part && !noVM;
      if (isSV(m) && vm && syls.length) {
        var prev = syls[syls.length - 1];
        var a = prev.charAt(prev.length - 1);
        if (VOW.indexOf(a) >= 0 && pairMerges(a, m)) {
          syls[syls.length - 1] = prev + m;
          noVM = false;
          return;
        }
      }
      syls.push(m);
      noVM = false;
    }
    function pushWord(arr) {
      if (gem) { gem = false; syls.push("tsu"); }
      for (var i = 0; i < arr.length; i++) syls.push(arr[i]);
      noVM = true;
    }
    function flush() {
      if (gem) { gem = false; syls.push("tsu"); }
      var s = syls.join("-");
      syls = [];
      noVM = false;
      return s;
    }
    return { pushTok: pushTok, pushWord: pushWord, flush: flush };
  }

  // ---------- Kana helpers ----------
  function normalizeKana(ch) {
    var c = ch.charCodeAt(0);
    if (c >= 0x30A1 && c <= 0x30F6) return String.fromCharCode(c - 0x60);
    if (ch === "ｰ") return "ー";
    return ch;
  }
  function isHiraganaCode(c) { return c >= 0x3041 && c <= 0x3096; }
  function isKatakanaCode(c) {
    return (c >= 0x30A1 && c <= 0x30F6) || c === 0x30FC || c === 0xFF70;
  }
  function isKanaChar(ch) {
    var c = ch.charCodeAt(0);
    return isHiraganaCode(c) || isKatakanaCode(c);
  }
  // Tokenize one kana position. noPart=true disables particle readings (for dict readings).
  function tokenizeKanaAt(text, i, noPart) {
    var ch = text[i];
    if (ch === "ー" || ch === "ｰ") return { toks: [{ k: "long" }], next: i + 1 };
    if (!noPart) {
      if (ch === "は") return { toks: [{ k: "m", m: "wa", part: true }], next: i + 1 };
      if (ch === "へ") return { toks: [{ k: "m", m: "e", part: true }], next: i + 1 };
      if (ch === "を" || ch === "ヲ") return { toks: [{ k: "m", m: "o", part: true }], next: i + 1 };
    } else if (ch === "ヲ") {
      return { toks: [{ k: "m", m: "o", part: true }], next: i + 1 };
    }
    var nch = normalizeKana(ch);
    if (nch === "っ") return { toks: [{ k: "gem" }], next: i + 1 };
    if (nch === "ん") return { toks: [{ k: "n" }], next: i + 1 };
    var nx = (i + 1 < text.length) ? normalizeKana(text[i + 1]) : "";
    if (DIGRAPH_Y[nch] && (nx === "ゃ" || nx === "ゅ" || nx === "ょ")) {
      var v = nx === "ゃ" ? "a" : (nx === "ゅ" ? "u" : "o");
      return { toks: [{ k: "m", m: DIGRAPH_Y[nch] + v }], next: i + 2 };
    }
    var pair = nch + nx;
    if (nx && EXT[pair]) return { toks: [{ k: "m", m: EXT[pair] }], next: i + 2 };
    if (KANA[nch]) return { toks: [{ k: "m", m: KANA[nch] }], next: i + 1 };
    return { toks: [], next: i + 1 };
  }
  function tokenizeKanaStr(str, noPart) {
    var toks = [];
    var i = 0;
    while (i < str.length) {
      var r = tokenizeKanaAt(str, i, noPart);
      for (var t = 0; t < r.toks.length; t++) toks.push(r.toks[t]);
      i = r.next;
    }
    return toks;
  }

  // ---------- Kanji runs ----------
  // e = [onKana, kunTok1, kunTok2, ...]; kun tokens keep okurigana after '-'.
  function commonPrefixLen(a, b) {
    var n = Math.min(a.length, b.length);
    var i = 0;
    while (i < n && a.charAt(i) === b.charAt(i)) i++;
    return i;
  }
  function pickKun(e, following) {
    var toks = e.slice(1);
    if (!toks.length) return e[0] || "";
    if (!following) return toks[0].split("-")[0];
    var best = toks[0];
    var bestScore = -1;
    for (var i = 0; i < toks.length; i++) {
      var parts = toks[i].split("-");
      var okuri = parts.length > 1 ? parts.slice(1).join("") : "";
      var score = okuri ? commonPrefixLen(okuri, following) : 0;
      if (score > bestScore) { bestScore = score; best = toks[i]; }
    }
    return best.split("-")[0];
  }
  function pushKanjiRun(text, i, buf) {
    var j = i;
    var seq = [];
    while (j < text.length && KANJI[text[j]]) { seq.push(text[j]); j++; }
    var useOn = seq.length > 1; // single kanji → kun (bare nouns/verbs); runs → on
    var following = "";
    if (!useOn) {
      var k = j;
      while (k < text.length && isHiraganaCode(text.charCodeAt(k)) && following.length < 8) {
        following += text[k];
        k++;
      }
    }
    for (var s = 0; s < seq.length; s++) {
      var e = KANJI[seq[s]];
      var kana = useOn ? (e[0] || e[1] || "") : (pickKun(e, following) || e[0] || "");
      if (!kana) continue;
      var toks = tokenizeKanaStr(kana, true);
      for (var t = 0; t < toks.length; t++) buf.pushTok(toks[t], useOn);
    }
    return j;
  }

  // ---------- Main conversion ----------
  function convert(text) {
    var out = [];
    var buf = newBuf();
    function flush() {
      var s = buf.flush();
      if (s) out.push(s);
    }
    var i = 0;
    while (i < text.length) {
      var ch = text[i];
      var code = text.charCodeAt(i);
      if (code >= 0xD800 && code <= 0xDBFF && i + 1 < text.length) {
        var lo = text.charCodeAt(i + 1);
        if (lo >= 0xDC00 && lo <= 0xDFFF) {
          flush();
          out.push(ch + text[i + 1]);
          i += 2;
          continue;
        }
      }
      var hit = null;
      for (var L = MAXWLEN; L >= 1; L--) {
        if (i + L > text.length) continue;
        var sub = text.substr(i, L);
        if (WORDS[sub]) { hit = sub; break; }
      }
      if (hit) {
        buf.pushWord(WORDS[hit]);
        i += hit.length;
        continue;
      }
      if (KANJI[ch]) {
        i = pushKanjiRun(text, i, buf);
        continue;
      }
      if (isKanaChar(ch)) {
        var r = tokenizeKanaAt(text, i, false);
        if (r.toks.length) {
          var kata = isKatakanaCode(code);
          for (var t = 0; t < r.toks.length; t++) buf.pushTok(r.toks[t], kata);
          i = r.next;
          continue;
        }
        flush();
        out.push(ch);
        i++;
        continue;
      }
      flush();
      out.push(ch);
      i++;
    }
    flush();
    return out.join("");
  }

  var inputEl = document.getElementById("input");
  var outputEl = document.getElementById("output");
  var copyBtn = document.getElementById("copyBtn");

  function update() {
    outputEl.textContent = convert(inputEl.value);
  }

  inputEl.addEventListener("input", update);
  copyBtn.addEventListener("click", function () {
    function done() {
      copyBtn.classList.add("copied");
      setTimeout(function () { copyBtn.classList.remove("copied"); }, 1200);
    }
    var text = outputEl.textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  });

  function fallbackCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { /* noop */ }
    document.body.removeChild(ta);
  }

  // Expose for console testing.
  window.japConvert = convert;

  update();
})();
</script>
</body>
</html>
